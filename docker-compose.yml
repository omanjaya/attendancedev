# ============================================
# Attendance System - Docker Compose (Development)
# ============================================
# Usage: 
#   docker compose up -d          # Start containers
#   docker compose watch          # Start with auto-rebuild (dev)
# ============================================
# Project Name: attendancedev
# All containers will be prefixed with: attendancedev-
# ============================================

name: attendancedev

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: attendancedev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-attendance_system}
      POSTGRES_USER: ${DB_USERNAME:-attendance_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-attendance123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: Port commented out for production - use docker-compose.override.yml for dev
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-attendance_user} -d ${DB_DATABASE:-attendance_system}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance_network

  # ==========================================
  # Redis Cache & Session
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: attendancedev-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-redis_secure_password_change_me}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secure_password_change_me}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance_network

  # ==========================================
  # Laravel Backend (PHP-FPM)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: attendancedev-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-attendance_system}
      - DB_USERNAME=${DB_USERNAME:-attendance_user}
      - DB_PASSWORD=${DB_PASSWORD:-attendance123}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password_change_me}
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=database
      - DEEPFACE_BASE_URL=http://deepface-1:8001
      # Mail Configuration (Gmail SMTP)
      # SECURITY: Credentials moved to .env file - never commit secrets!
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-"Sistem Absensi Patra"}
      # Cloudflare Turnstile CAPTCHA
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - attendance_network
    develop:
      watch:
        # Auto-sync PHP source code changes
        - action: sync
          path: ./backend/app
          target: /var/www/html/app
        - action: sync
          path: ./backend/config
          target: /var/www/html/config
        - action: sync
          path: ./backend/routes
          target: /var/www/html/routes
        # Rebuild when composer dependencies change
        - action: rebuild
          path: ./backend/composer.json
        - action: rebuild
          path: ./backend/composer.lock

  # ==========================================
  # React Frontend (Development)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile.dev
    container_name: attendancedev-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost/api}
      - VITE_DEEPFACE_URL=${VITE_DEEPFACE_URL:-http://localhost:8001}
    networks:
      - attendance_network
    develop:
      watch:
        # Auto-sync source code changes
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        # Rebuild when package.json changes
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/vite.config.ts

  # ==========================================
  # Python DeepFace Service
  # ==========================================
  deepface-1:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: attendancedev-deepface-1
    restart: unless-stopped
    volumes:
      - ./python-services/face-recognition:/app
      - deepface_models:/app/.deepface
      - face_data:/app/face_data
    ports:
      - "8001:8001"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - DEEPFACE_MODEL=${DEEPFACE_MODEL:-ArcFace}
      - DEEPFACE_DETECTOR=${DEEPFACE_DETECTOR:-retinaface}
      - DEEPFACE_THRESHOLD=${DEEPFACE_THRESHOLD:-0.68}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - attendance_network

  deepface-2:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    container_name: attendancedev-deepface-2
    restart: unless-stopped
    volumes:
      - ./python-services/face-recognition:/app
      - deepface_models:/app/.deepface
      - face_data:/app/face_data
    ports:
      - "8002:8001"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - DEEPFACE_MODEL=${DEEPFACE_MODEL:-ArcFace}
      - DEEPFACE_DETECTOR=${DEEPFACE_DETECTOR:-retinaface}
      - DEEPFACE_THRESHOLD=${DEEPFACE_THRESHOLD:-0.68}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - attendance_network

  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: attendancedev-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/public:/var/www/html/public:ro
      - ./backend/storage/app/public:/var/www/html/storage/app/public:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./frontend/dist:/var/www/frontend:ro
    depends_on:
      - backend
      - frontend
      - deepface-1
    networks:
      - attendance_network

  # ==========================================
  # Adminer (Database Management - Dev only)
  # ==========================================
  adminer:
    image: adminer
    container_name: attendancedev-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - attendance_network
    profiles:
      - dev

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  deepface_models:
    driver: local
  face_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  attendance_network:
    name: attendancedev-network
    driver: bridge
