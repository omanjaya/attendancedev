name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        php-version: [8.3]
        node-version: [20]

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_pgsql, redis
        coverage: xdebug

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: backend/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
      working-directory: ./backend

    - name: Install NPM dependencies
      run: npm ci

    - name: Build assets
      run: npm run build

    - name: Copy environment file
      run: cp .env.example .env.testing
      working-directory: ./backend

    - name: Generate application key
      run: php artisan key:generate --env=testing
      working-directory: ./backend

    - name: Configure test environment
      run: |
        echo "DB_CONNECTION=pgsql" >> .env.testing
        echo "DB_HOST=127.0.0.1" >> .env.testing
        echo "DB_PORT=5432" >> .env.testing
        echo "DB_DATABASE=attendance_test" >> .env.testing
        echo "DB_USERNAME=postgres" >> .env.testing
        echo "DB_PASSWORD=postgres" >> .env.testing
        echo "REDIS_HOST=127.0.0.1" >> .env.testing
        echo "REDIS_PORT=6379" >> .env.testing
        echo "CACHE_DRIVER=redis" >> .env.testing
        echo "SESSION_DRIVER=redis" >> .env.testing
        echo "QUEUE_CONNECTION=redis" >> .env.testing
      working-directory: ./backend

    - name: Clear config cache
      run: php artisan config:clear
      working-directory: ./backend

    - name: Run database migrations
      run: php artisan migrate --env=testing --force
      working-directory: ./backend

    - name: Seed database
      run: php artisan db:seed --env=testing --force
      working-directory: ./backend

    - name: Run Unit Tests
      run: php artisan test --testsuite=Unit
      working-directory: ./backend
      continue-on-error: true

    - name: Run Feature Tests
      run: php artisan test --testsuite=Feature
      working-directory: ./backend
      continue-on-error: true

    - name: Upload test coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage-unit.xml,./coverage-feature.xml
        flags: tests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Archive test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: |
          backend/storage/logs/
          backend/build/

  quality:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        extensions: mbstring, xml, ctype, iconv, intl

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
      working-directory: ./backend

    - name: Run Security Audit
      run: composer audit
      working-directory: ./backend

    - name: Check for outdated packages
      run: composer outdated --direct
      working-directory: ./backend
      continue-on-error: true

  browser-tests:
    # SKIPPED: E2E tests dijalankan secara lokal saja, tidak di CI
    if: false
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
      working-directory: ./backend

    - name: Install NPM dependencies
      run: npm ci

    - name: Build assets
      run: npm run build

    - name: Setup Dusk environment
      run: |
        cp .env.example .env.dusk.local
        php artisan key:generate --env=dusk.local
      working-directory: ./backend

    - name: Run Playwright E2E tests
      run: npm run test:e2e
      continue-on-error: true

    - name: Archive E2E screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: e2e-screenshots
        path: frontend/playwright-report/