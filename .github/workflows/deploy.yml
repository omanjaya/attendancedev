# ============================================
# CI/CD Pipeline - Build & Deploy to VPS
# ============================================
# Workflow ini akan:
# 1. Build Docker images untuk semua services
# 2. Push ke Docker Hub
# 3. Deploy ke VPS via SSH
# 
# Optimization features:
# - [skip ci] support in commit message
# - Path-based conditional builds
# - Skip for docs-only changes
# ============================================

name: Build & Deploy

on:
  push:
    branches:
      - main
      - production
    tags:
      - 'v*'
    # Skip workflow untuk documentation-only changes
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'README*'
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      force_build_all:
        description: 'Force build all images'
        required: false
        default: false
        type: boolean
      run_seeder:
        description: 'Run Seeder (Clean & Import Excel). PERINGATAN: Mereset data!'
        required: false
        default: false
        type: boolean

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/attendancedev

jobs:
  # ==========================================
  # Job 0: Check if CI should be skipped
  # ==========================================
  check-skip:
    name: Check Skip Conditions
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Check for [skip ci] in commit message
        id: skip_check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]] || [[ "$COMMIT_MSG" == *"[ci skip]"* ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping CI due to [skip ci] in commit message"
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
            echo "✅ Proceeding with CI"
          fi

  # ==========================================
  # Job 1: Detect Changes
  # ==========================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      deepface: ${{ steps.changes.outputs.deepface }}
      any_changes: ${{ steps.changes.outputs.backend == 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.deepface == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check path changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker/php/**'
              - 'docker/nginx/**'
            frontend:
              - 'frontend/**'
              - 'docker/node/**'
            deepface:
              - 'deepface/**'
              - 'docker/python/**'

      - name: Log detected changes
        run: |
          echo "Backend changes: ${{ steps.changes.outputs.backend }}"
          echo "Frontend changes: ${{ steps.changes.outputs.frontend }}"
          echo "DeepFace changes: ${{ steps.changes.outputs.deepface }}"

  # ==========================================
  # Job 2: Build & Test
  # ==========================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [check-skip, detect-changes]
    if: |
      needs.check-skip.outputs.should_skip != 'true' && 
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring, bcmath, gd, intl, redis

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_DEEPFACE_URL: ${{ secrets.VITE_DEEPFACE_URL }}

      - name: Install Backend Dependencies
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: Validate Laravel
        run: |
          cd backend
          php artisan config:clear
          php artisan route:clear

      # Upload build artifacts untuk digunakan di job selanjutnya
      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  # ==========================================
  # Job 3: Build Docker Images (Conditional)
  # ==========================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-and-test, detect-changes]
    outputs:
      backend_built: ${{ steps.backend_status.outputs.built }}
      frontend_built: ${{ steps.frontend_status.outputs.built }}
      deepface_built: ${{ steps.deepface_status.outputs.built }}
      version: ${{ steps.meta.outputs.VERSION }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION=latest
          else
            VERSION=${GITHUB_SHA::8}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # Build Backend Image (conditional)
      - name: Build & Push Backend Image
        id: build_backend
        if: needs.detect-changes.outputs.backend == 'true' || github.event.inputs.force_build_all == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Mark Backend Built
        if: needs.detect-changes.outputs.backend == 'true' || github.event.inputs.force_build_all == 'true'
        run: echo "built=true" >> $GITHUB_OUTPUT
        id: backend_status

      # Build Frontend Image (conditional)
      - name: Build & Push Frontend Image
        id: build_frontend
        if: needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.force_build_all == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/node/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_DEEPFACE_URL=${{ secrets.VITE_DEEPFACE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Mark Frontend Built
        if: needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.force_build_all == 'true'
        run: echo "built=true" >> $GITHUB_OUTPUT
        id: frontend_status

      # Build DeepFace Image (conditional)
      - name: Build & Push DeepFace Image
        id: build_deepface
        if: needs.detect-changes.outputs.deepface == 'true' || github.event.inputs.force_build_all == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/python/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-deepface:${{ steps.meta.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-deepface:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Mark DeepFace Built
        if: needs.detect-changes.outputs.deepface == 'true' || github.event.inputs.force_build_all == 'true'
        run: echo "built=true" >> $GITHUB_OUTPUT
        id: deepface_status

      - name: Summarize builds
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Built |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.detect-changes.outputs.backend == 'true' && '✅' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.detect-changes.outputs.frontend == 'true' && '✅' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DeepFace | ${{ needs.detect-changes.outputs.deepface == 'true' && '✅' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Job 4: Deploy to VPS
  # ==========================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-docker, detect-changes]
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/')) &&
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.deepface == 'true' || github.event.inputs.force_build_all == 'true' || github.event.inputs.run_seeder == 'true')
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=latest
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate required secrets
        run: |
          echo "Validating required secrets..."
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "ERROR: VPS_HOST is missing"; exit 1; fi
          if [ -z "${{ secrets.VPS_USERNAME }}" ]; then echo "ERROR: VPS_USERNAME is missing"; exit 1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "ERROR: VPS_SSH_KEY is missing"; exit 1; fi
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then echo "ERROR: DOCKERHUB_USERNAME is missing"; exit 1; fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then echo "ERROR: DOCKERHUB_TOKEN is missing"; exit 1; fi
          echo "✅ All required secrets are present"

      - name: Show deploy version
        run: |
          echo "Deploy VERSION = ${{ steps.version.outputs.VERSION }}"
          echo "DEPLOY_BACKEND = ${{ needs.detect-changes.outputs.backend == 'true' || github.event.inputs.force_build_all == 'true' }}"
          echo "DEPLOY_FRONTEND = ${{ needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.force_build_all == 'true' }}"
          echo "DEPLOY_DEEPFACE = ${{ needs.detect-changes.outputs.deepface == 'true' || github.event.inputs.force_build_all == 'true' }}"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BACKEND: ${{ needs.detect-changes.outputs.backend == 'true' || github.event.inputs.force_build_all == 'true' }}
          DEPLOY_FRONTEND: ${{ needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.force_build_all == 'true' }}
          DEPLOY_DEEPFACE: ${{ needs.detect-changes.outputs.deepface == 'true' || github.event.inputs.force_build_all == 'true' }}
          RUN_SEEDER: ${{ github.event.inputs.run_seeder == 'true' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DEPLOY_BACKEND,DEPLOY_FRONTEND,DEPLOY_DEEPFACE,RUN_SEEDER
          script: |
            set -e  # Exit on any error
            
            # Navigate to project directory
            cd /opt/attendancedev
            
            # Stash any local changes and pull latest config files
            git stash --include-untracked || true
            git fetch origin
            git checkout origin/main -- docker-compose.prod.yml || true
            git checkout origin/main -- docker/nginx/nginx.conf || true
            
            # Login to Docker Hub with error handling
            echo "🔐 Logging in to Docker Hub..."
            if ! echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin; then
              echo "❌ ERROR: Docker login failed. Check DOCKERHUB_TOKEN and DOCKERHUB_USERNAME."
              exit 1
            fi
            echo "✅ Docker login successful"
            
            echo "📦 Selectively pulling and deploying images..."
            
            # Pull and tag only rebuilt images with error handling
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              echo "🔧 Pulling Backend image: ${{ env.IMAGE_PREFIX }}-backend:${{ steps.version.outputs.VERSION }}"
              if ! docker pull ${{ env.IMAGE_PREFIX }}-backend:${{ steps.version.outputs.VERSION }}; then
                echo "❌ ERROR: Failed to pull backend image"
                exit 1
              fi
              docker tag ${{ env.IMAGE_PREFIX }}-backend:${{ steps.version.outputs.VERSION }} attendancedev-backend:latest
              echo "✅ Backend image pulled and tagged"
            else
              echo "⏭️ Skipping Backend (no changes)"
            fi
            
            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              echo "🎨 Pulling Frontend image: ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.VERSION }}"
              if ! docker pull ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.VERSION }}; then
                echo "❌ ERROR: Failed to pull frontend image"
                exit 1
              fi
              docker tag ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.VERSION }} attendancedev-frontend:latest
              echo "✅ Frontend image pulled and tagged"
            else
              echo "⏭️ Skipping Frontend (no changes)"
            fi
            
            if [ "$DEPLOY_DEEPFACE" = "true" ]; then
              echo "🤖 Pulling DeepFace image: ${{ env.IMAGE_PREFIX }}-deepface:${{ steps.version.outputs.VERSION }}"
              if ! docker pull ${{ env.IMAGE_PREFIX }}-deepface:${{ steps.version.outputs.VERSION }}; then
                echo "❌ ERROR: Failed to pull deepface image"
                exit 1
              fi
              docker tag ${{ env.IMAGE_PREFIX }}-deepface:${{ steps.version.outputs.VERSION }} attendancedev-deepface:latest
              echo "✅ DeepFace image pulled and tagged"
            else
              echo "⏭️ Skipping DeepFace (no changes)"
            fi
            
            # Backup database before deployment (use POSTGRES_USER and POSTGRES_DB from container env)
            docker exec attendancedev-postgres sh -c 'pg_dump -U $POSTGRES_USER $POSTGRES_DB' > /tmp/backup_$(date +%Y%m%d_%H%M%S).sql || true
            
            # Deploy with zero-downtime
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans || docker compose up -d --no-build --remove-orphans

            # Wait for services to be ready
            sleep 10

            # Run migrations if backend was updated
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              echo "🗄️ Running migrations..."
              docker exec attendancedev-backend php artisan migrate --force || true
              docker exec attendancedev-backend php artisan config:cache || true
              docker exec attendancedev-backend php artisan route:cache || true
              docker exec attendancedev-backend php artisan view:cache || true
              docker exec attendancedev-backend php artisan queue:restart || true
            fi

            # Cleanup old images
            docker image prune -af --filter "until=168h" || true

            # Run Seeder if requested
            if [ "$RUN_SEEDER" = "true" ]; then
              echo "🌱 Running Custom Seeder (Clean & Import)..."
              docker exec attendancedev-backend php artisan db:seed --class=CleanAndImportExcelSeeder --force || true
            fi

            echo "✅ Deployment completed!"
            echo "   Backend: $DEPLOY_BACKEND"
            echo "   Frontend: $DEPLOY_FRONTEND"  
            echo "   DeepFace: $DEPLOY_DEEPFACE"

      - name: Notify Deployment Status
        if: always()
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Deployment ${{ job.status }}
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            
            📦 Images Deployed:
            • Backend: ${{ needs.detect-changes.outputs.backend == 'true' && '✅ Updated' || '⏭️ Skipped' }}
            • Frontend: ${{ needs.detect-changes.outputs.frontend == 'true' && '✅ Updated' || '⏭️ Skipped' }}
            • DeepFace: ${{ needs.detect-changes.outputs.deepface == 'true' && '✅ Updated' || '⏭️ Skipped' }}
            
            ${{ job.status == 'success' && '✅ Successfully deployed to production!' || '❌ Deployment failed. Check logs.' }}

  # ==========================================
  # Job 5: Health Check
  # ==========================================
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    # Health check is informational - don't fail the workflow if it fails
    continue-on-error: true

    steps:
      - name: Wait for services to stabilize
        run: sleep 60

      - name: Check API Health
        continue-on-error: true
        run: |
          APP_URL="${{ secrets.APP_URL }}"
          if [ -z "$APP_URL" ]; then
            echo "⚠️ APP_URL secret not set, skipping health check"
            exit 0
          fi

          echo "Checking API at: $APP_URL/api/health"

          # Retry up to 6 times with 15 second intervals
          for i in {1..6}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL/api/health" || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ API is healthy"
              exit 0
            else
              echo "Attempt $i/6: API returned status $response. Waiting 15s..."
              sleep 15
            fi
          done

          echo "⚠️ API health check failed after 6 attempts - services may still be starting"
          exit 0  # Don't fail the workflow

      - name: Check Frontend
        run: |
          APP_URL="${{ secrets.APP_URL }}"
          if [ -z "$APP_URL" ]; then
            echo "⚠️ APP_URL secret not set, skipping frontend check"
            exit 0
          fi

          echo "Checking Frontend at: $APP_URL"

          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL" || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Frontend is accessible"
              exit 0
            else
              echo "Attempt $i/5: Frontend returned status $response. Waiting..."
              sleep 10
            fi
          done

          echo "❌ Frontend check failed after 5 attempts"
          exit 1

      - name: Check DeepFace Service
        run: |
          APP_URL="${{ secrets.APP_URL }}"
          if [ -z "$APP_URL" ]; then
            echo "⚠️ APP_URL secret not set, skipping DeepFace check"
            exit 0
          fi

          echo "Checking DeepFace at: $APP_URL/deepface/health"
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL/deepface/health" || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ DeepFace service is healthy"
          else
            echo "⚠️ DeepFace service check returned: $response (may still be starting)"
          fi
