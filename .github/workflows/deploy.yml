# ============================================
# CI/CD Pipeline - Build & Deploy to VPS
# ============================================
# Workflow ini akan:
# 1. Build Docker images untuk semua services
# 2. Push ke Docker Hub
# 3. Deploy ke VPS via SSH
# ============================================

name: Build & Deploy

on:
  push:
    branches:
      - main
      - production
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/attendancedev

jobs:
  # ==========================================
  # Job 1: Build & Test
  # ==========================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, mbstring, bcmath, gd, intl, redis

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_DEEPFACE_URL: ${{ secrets.VITE_DEEPFACE_URL }}

      - name: Install Backend Dependencies
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: Validate Laravel
        run: |
          cd backend
          php artisan config:clear
          php artisan route:clear

      # Upload build artifacts untuk digunakan di job selanjutnya
      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  # ==========================================
  # Job 2: Build Docker Images
  # ==========================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION=latest
          else
            VERSION=${GITHUB_SHA::8}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # Build Backend Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Build Frontend Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/node/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_DEEPFACE_URL=${{ secrets.VITE_DEEPFACE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Build DeepFace Image
      - name: Build & Push DeepFace Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/python/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-deepface:${{ steps.meta.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-deepface:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ==========================================
  # Job 3: Deploy to VPS
  # ==========================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' || startsWith(github.ref, 'refs/tags/')
    environment: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=latest
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            
            # Navigate to project directory
            cd /opt/attendancedev
            
            # Pull latest docker-compose.prod.yml
            git fetch origin
            git checkout origin/main -- docker-compose.prod.yml
            git checkout origin/main -- docker/nginx/nginx.conf
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Pull latest images
            docker pull ${{ env.IMAGE_PREFIX }}-backend:${{ steps.version.outputs.VERSION }}
            docker pull ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.VERSION }}
            docker pull ${{ env.IMAGE_PREFIX }}-deepface:${{ steps.version.outputs.VERSION }}
            
            # Tag as local
            docker tag ${{ env.IMAGE_PREFIX }}-backend:${{ steps.version.outputs.VERSION }} attendancedev-backend:latest
            docker tag ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.VERSION }} attendancedev-frontend:latest
            docker tag ${{ env.IMAGE_PREFIX }}-deepface:${{ steps.version.outputs.VERSION }} attendancedev-deepface:latest
            
            # Backup database before deployment
            docker exec attendancedev-postgres pg_dump -U \$DB_USERNAME \$DB_DATABASE > /tmp/backup_$(date +%Y%m%d_%H%M%S).sql || true
            
            # Deploy with zero-downtime
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
            
            # Run migrations
            docker exec attendancedev-backend php artisan migrate --force
            
            # Clear and rebuild cache
            docker exec attendancedev-backend php artisan config:cache
            docker exec attendancedev-backend php artisan route:cache
            docker exec attendancedev-backend php artisan view:cache
            
            # Restart queue workers
            docker exec attendancedev-backend php artisan queue:restart
            
            # Cleanup old images
            docker image prune -af --filter "until=168h"
            
            echo "✅ Deployment completed successfully!"

      - name: Notify Deployment Status
        if: always()
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Deployment ${{ job.status }}
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            
            ${{ job.status == 'success' && '✅ Successfully deployed to production!' || '❌ Deployment failed. Check logs.' }}

  # ==========================================
  # Job 4: Health Check
  # ==========================================
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Check API Health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/api/health")
          if [ "$response" = "200" ]; then
            echo "✅ API is healthy"
          else
            echo "❌ API health check failed with status: $response"
            exit 1
          fi

      - name: Check Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}")
          if [ "$response" = "200" ]; then
            echo "✅ Frontend is accessible"
          else
            echo "❌ Frontend check failed with status: $response"
            exit 1
          fi

      - name: Check DeepFace Service
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/deepface/health")
          if [ "$response" = "200" ]; then
            echo "✅ DeepFace service is healthy"
          else
            echo "⚠️ DeepFace service check returned: $response (may still be starting)"
          fi
